name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد ریپازیتوری
        uses: actions/checkout@v4

      - name: خارج کردن فایل ZIP پروژه
        run: |
          unzip -o ContactManager.zip -d extracted
          # پیدا کردن پوشه‌ای که واقعاً ریشه پروژه (حاوی settings.gradle.kts) است
          PROJECT_DIR=$(dirname "$(find extracted -maxdepth 4 -name 'settings.gradle.kts' | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "مسیر پروژه پیدا شد: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: نصب JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: راه‌اندازی Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: ساخت نسخه Debug (APK)
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: پیدا کردن مسیر دقیق فایل APK
        run: |
          APK_PATH=$(find "${{ env.PROJECT_DIR }}" -name "app-debug.apk" | head -n 1)
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "فایل APK ساخته شد در: $APK_PATH"

      - name: آپلود فایل APK به‌عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.APK_PATH }}
